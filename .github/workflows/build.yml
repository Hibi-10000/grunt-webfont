name: build

on:
  push:
    branches:
      - esm
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - name: Run pnpm install
        run: |
          pnpm ci --no-runtime
          tree node_modules/.pnpm/ | grep @rolldown+binding

      - name: Run build
        run: |
          pnpm exec node -v
          pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-node${{ matrix.node-version }}
          path: dist
